<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
.welcome{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wpanel{background:var(--paper);color:var(--ink);border-radius:10px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:30px 30px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.wpanel .seal{width:88px;height:88px;margin:0 auto 10px;display:block}
.wpanel h2{font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:26px;letter-spacing:.04em;margin:0 0 14px;color:var(--accent)}
:root:lang(ar) .wpanel h2,:root:lang(zh) .wpanel h2{font-family:var(--body)}
#wBody{text-align:start;font-size:16.5px;line-height:1.6}
#wBody p{margin:0 0 12px}
#wBody .wai{color:var(--muted);font-size:14.5px}
.wpanel .motto{font:600 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:8px 0 18px}
.wbtn{font:600 14px var(--mono);background:var(--accent);color:var(--paper);border:0;border-radius:6px;padding:12px 22px;cursor:pointer;min-height:44px}
.wbtn:hover{filter:brightness(1.08)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (max-width:480px){.wpanel{padding:22px 18px 20px}.wpanel h2{font-size:22px}}

.shpanel{max-width:480px;text-align:start}
.shpanel h2{text-align:center}
.shrow{display:flex;gap:8px;margin:0 0 18px}
.shrow input{flex:1;min-width:0;font:13px var(--mono);color:var(--ink);background:var(--tint);border:1px solid var(--rule);border-radius:6px;padding:0 10px;min-height:44px}
.shrow .wbtn{white-space:nowrap;padding:0 16px}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:0 0 18px}
.shgrid a,.shgrid button{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font:600 13px var(--mono);text-decoration:none;cursor:pointer;text-align:start}
.shgrid a:hover,.shgrid button:hover{border-color:var(--accent);color:var(--accent)}
.shgrid .shdot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 12px var(--mono)}
.shpanel #shClose{display:block;margin:0 auto}

.srcrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.srcrow .src{margin-top:0}
.sshare{flex:none;display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--rule);border-radius:50%;background:none;color:var(--muted);cursor:pointer}
.sshare:hover{color:var(--accent);border-color:var(--accent)}
.sshare svg{width:15px;height:15px}
.board li .when{display:flex;align-items:center;justify-content:space-between;gap:8px}
.board li .sshare{width:30px;height:30px}
.stpanel{max-width:600px;text-align:start}
.stpanel .kicker{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--accent));margin:0 0 8px}
.stpanel h2{font-family:var(--body);font-weight:600;font-size:clamp(22px,4vw,28px);line-height:1.22;letter-spacing:0;color:var(--ink);text-align:start;margin:0 0 10px}
.stpanel .sum{font-size:17px;line-height:1.6;margin:0 0 16px}
.stpanel .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.stpanel .acts a.wbtn{text-decoration:none;display:inline-flex;align-items:center}
.wbtn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.stpanel .brand{display:flex;align-items:center;gap:8px;font:700 13px "Cinzel",Georgia,serif;letter-spacing:.12em;color:var(--accent);margin:0 0 14px}

a.hl{color:inherit;text-decoration:none;cursor:pointer}
a.hl:hover,a.hl:focus-visible{text-decoration:underline;text-decoration-thickness:1.5px;text-decoration-color:var(--c,var(--accent));text-underline-offset:4px}
.det{border-top:1px solid var(--rule);padding-top:14px;margin:0 0 16px}
.det h3{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--accent));margin:16px 0 8px}
.det h3:first-child{margin-top:0}
.det ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.det li,.det p{font-size:16.5px;line-height:1.55;margin:0}
.det .sides{list-style:none;padding:0}
.det .sides li{padding-inline-start:12px;border-inline-start:3px solid var(--rule)}
.det .srcs{list-style:none;padding:0;flex-direction:row;flex-wrap:wrap;gap:6px 14px}
.det .srcs li{font:500 13.5px var(--mono)}
.det .srcs a{color:var(--accent);text-underline-offset:3px}
.det .ainote{font:400 12.5px var(--mono);color:var(--muted);margin-top:14px}
.det .loading{color:var(--muted);font:400 13px var(--mono)}

.tvbox{border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--card);min-height:200px;margin:0 0 10px}
.tvbox .tvnote{padding:22px;font-size:16px;line-height:1.55;margin:0}
.tvbox .tvnote a{color:var(--accent)}
.mk-h{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mk-disc{font:400 13px var(--mono);color:var(--muted);margin:18px 0 0;max-width:80ch}

.mk-an{border:2px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 6%,var(--card));border-radius:8px;padding:20px 22px 18px;margin:0 0 6px}
.mk-an .top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin:0 0 10px}
.mk-an .rec{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--paper);border-radius:99px;padding:4px 10px}
.mk-an .asof{font:400 12px var(--mono);color:var(--muted)}
.mk-an .eyebrow{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.mk-an h2{font-weight:600;font-size:clamp(22px,3vw,28px);line-height:1.2;margin:0 0 8px;text-wrap:balance}
.mk-an .lede{font-size:17px;line-height:1.55;margin:0 0 14px;max-width:75ch}
.mk-an dl{margin:0;display:grid;grid-template-columns:minmax(140px,190px) minmax(0,1fr);gap:0;border-top:1px solid var(--rule)}
.mk-an dt,.mk-an dd{margin:0;padding:11px 0;border-bottom:1px solid var(--rule)}
.mk-an dt{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding-inline-end:14px;padding-top:14px}
.mk-an dd{font-size:16px;line-height:1.55}
@media (max-width:620px){.mk-an dl{grid-template-columns:1fr}.mk-an dt{border-bottom:0;padding-bottom:0}.mk-an{padding:16px 16px 14px}}
.mk-an .srcs{font:500 13px var(--mono);color:var(--muted);margin:12px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px}
.mk-an .srcs a{color:var(--accent);text-underline-offset:3px}

.ctpanel{max-width:520px;text-align:start}
.ctpanel h2{text-align:center}
.ctintro{font-size:16px;line-height:1.55;color:var(--muted);margin:0 0 18px;text-align:center}
.ctlist{display:flex;flex-direction:column;gap:12px;margin:0 0 20px}
.ctitem{border:1px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--card)}
.ctitem h3{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.ctitem p{font-size:15.5px;line-height:1.5;margin:0 0 10px}
.ctrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrow a{font:600 15px var(--mono);color:var(--ink);text-decoration:none;word-break:break-all;margin-inline-end:auto}
.ctrow a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.ctrow button{font:600 12px var(--mono);border:1px solid var(--rule);background:none;color:var(--ink);border-radius:5px;padding:0 12px;min-height:36px;cursor:pointer}
.ctrow button:hover{border-color:var(--accent);color:var(--accent)}
.ctpanel #ctClose{display:block;margin:0 auto}
</style>
</head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cinzel:wght@700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Public+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: wire-desk — dark masthead with region row + desk row, briefing board with period dial, dispatch feeds per desk; owner-only Control Room */
:root{
  --paper:#ffffff; --card:#ffffff; --tint:#f3f7f4; --ink:#14201a; --muted:#56655c; --rule:#d9e2dc;
  --mast:#0f3b28; --mast-fg:#f1f7f3;
  --accent:#1d6b45; --gold:#b08d3c; --war:#b3263a; --money:#8a6200; --power:#6a43a8;
  --display:"Marcellus","Trajan Pro",Georgia,serif; --heavy:.028em;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"Public Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1612; --card:#151f19; --tint:#1a261f; --ink:#e3ebe6; --muted:#9db0a4; --rule:#26352c; --mast:#0a2318; --mast-fg:#e3ebe6;
  --accent:#6fcf97; --gold:#e3b850; --war:#ff7a85; --money:#e3b850; --power:#b9a0f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1612; --card:#151f19; --tint:#1a261f; --ink:#e3ebe6; --muted:#9db0a4; --rule:#26352c; --mast:#0a2318; --mast-fg:#e3ebe6;
  --accent:#6fcf97; --gold:#e3b850; --war:#ff7a85; --money:#e3b850; --power:#b9a0f2; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
:root:lang(ar),:root:lang(zh){--heavy:0}
:root:lang(ar){--body:"Noto Naskh Arabic","Source Serif 4",serif;--display:"Noto Naskh Arabic","Arial",sans-serif}
:root:lang(zh){--body:"Noto Serif SC","Source Serif 4",serif;--display:"Noto Serif SC","Arial",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mast)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--mast);color:var(--mast-fg)}
.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;cursor:pointer;background:none;border:0;color:inherit;padding:0;text-align:start}
.brand .mark{width:40px;height:44px;flex:none}
.brand .word{display:block;font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:30px;letter-spacing:.08em;line-height:1}
.brand .tagw{display:inline-block;vertical-align:middle;margin-inline-start:.55em;padding-inline-start:.55em;border-inline-start:1.5px solid #e3b850;font-size:13px;letter-spacing:.32em;color:#e3b850;line-height:1.2;position:relative;top:-2px}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.06em;opacity:.75;margin-top:5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:600 12.5px var(--mono);border:1px solid color-mix(in srgb,var(--mast-fg) 35%,transparent);background:none;color:inherit;padding:7px 11px;border-radius:4px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:color-mix(in srgb,var(--mast-fg) 10%,transparent)}
.btn.on,.lang button[aria-pressed="true"]{background:var(--mast-fg);color:var(--mast)}
.btn svg{width:14px;height:14px}
.btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sel{font:600 12.5px var(--mono);background:var(--mast);color:var(--mast-fg);border:1px solid color-mix(in srgb,var(--mast-fg) 35%,transparent);border-radius:4px;padding:6px 8px;cursor:pointer}
.lang{display:flex;border:1px solid color-mix(in srgb,var(--mast-fg) 35%,transparent);border-radius:4px;overflow:hidden}
.lang button{background:none;border:0;color:inherit;font:600 12.5px var(--mono);padding:7px 11px;cursor:pointer}
nav.row{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.regions{border-bottom:1px solid color-mix(in srgb,var(--mast-fg) 18%,transparent)}
nav.regions button{background:none;border:0;color:color-mix(in srgb,var(--mast-fg) 65%,transparent);font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;cursor:pointer;white-space:nowrap;border-radius:4px 4px 0 0}
nav.regions button[aria-selected="true"]{color:var(--mast);background:var(--mast-fg)}
nav.desks button{background:none;border:0;color:color-mix(in srgb,var(--mast-fg) 70%,transparent);font:400 15px var(--display);letter-spacing:.14em;text-transform:uppercase;-webkit-text-stroke:var(--heavy) currentColor;padding:10px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.desks button[aria-selected="true"]{color:var(--mast-fg);border-bottom-color:var(--tab,var(--accent))}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:28px 40px;min-height:60vh}
.stamp{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
h1,h2,h3{text-wrap:balance}
.deskhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px}
.deskhead .eyebrow{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.deskhead h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,46px);letter-spacing:.08em;line-height:1.05;margin:6px 0 0;text-transform:uppercase;-webkit-text-stroke:var(--heavy) currentColor}
.deskhead p{margin:6px 0 0;color:var(--muted);max-width:62ch;font-size:16px}
.dial{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.dial button{font:600 13px var(--mono);border:1px solid var(--rule);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.dial button[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--war);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot,.btn.spin svg{animation:none}}
.ticker{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:22px}
.ticker div{background:var(--card);padding:11px 14px;min-width:0}
.ticker .k{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ticker .v{font:600 21px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.ticker .d{font:12px var(--mono);color:var(--muted)}
.up{color:var(--money)!important} .down{color:var(--war)!important}
.lead{background:var(--tint);border:1px solid var(--rule);border-inline-start:4px solid var(--c,var(--accent));border-radius:6px;padding:22px 24px;margin-bottom:24px}
.kicker{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--accent));display:flex;gap:10px;flex-wrap:wrap}
.kicker .m{color:var(--muted);font-weight:400}
.lead h2{font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.2;margin:8px 0}
.lead p{margin:0 0 8px;max-width:72ch}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.col{min-width:0;border-top:4px solid var(--c);padding-top:12px}
.col h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:20px;letter-spacing:.12em;-webkit-text-stroke:var(--heavy) currentColor;margin:0 0 10px;color:var(--c)}
.col ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.col li{padding-block:12px;border-bottom:1px solid var(--rule)}
.col li:first-child{padding-top:0}
.col li:last-child{border-bottom:0}
.col li .when{font:12px var(--mono);color:var(--muted)}
.col li b{display:block;font-weight:600;line-height:1.3;margin:2px 0 3px}
.col li span.sum{font-size:15.5px;color:var(--muted)}
.col .empty{color:var(--muted);font-style:italic;font-size:15.5px}
.c-war{--c:var(--war)} .c-money{--c:var(--money)} .c-power{--c:var(--power)}
.section{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.section::after{content:"";flex:1;height:1px;background:var(--rule)}
.section:first-of-type{margin-top:0}
.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.feed{grid-template-columns:1fr}}
article.story{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:6px}
article.story.top{grid-column:1/-1;border-inline-start:4px solid var(--c)}
article.story.top h2{font-size:clamp(22px,2.6vw,28px)}
article.story h2{font-size:20px;line-height:1.25;margin:0;font-weight:600}
article.story p{margin:0;font-size:16px}
.src{margin-top:auto;padding-top:6px;font:12px var(--mono);color:var(--muted)}
.src a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.src a:hover{border-bottom-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);font:13px var(--mono);padding:10px 16px;border-radius:6px;z-index:20;max-width:calc(100vw - 32px)}
footer{border-top:1px solid var(--rule);padding-block:24px 40px;color:var(--muted);font-size:14px}
.foot-in{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.foot-in #foot{flex:1 1 320px;min-width:0}
.seal{width:96px;height:96px;flex:none}
footer p{max-width:80ch;margin:0 0 8px}
footer .copy{font:12px var(--mono);letter-spacing:.03em;margin-top:14px}
.loading{color:var(--muted);font:14px var(--mono);padding-block:40px}
/* control room */
.cr-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
@media (max-width:860px){.cr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--tint);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;min-width:0}
.stat .k{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 34px var(--mono);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}

    return d.toLocaleDateString(LOCALE[lang],{day:"numeric",month:"short",timeZone:"UTC"})+(t?` · ${t}`:""); }catch(e){ return d0 } }
function fmtEdition(iso){ const d=new Date(iso); try{ return d.toLocaleString(LOCALE[lang],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Paris"})+" "+PARIS[lang] }catch(e){ return iso } }

function inRegion(s){ return region==="worldwide" || s.r.includes(region) }
function windowFor(p){ const ed=dayNum(DATA.edition); const y0=dayNum(DATA.edition.slice(0,4)+"-01-01");
  return {live:[ed,ed],yday:[ed-1,ed-1],week:[ed-6,ed],month:[ed-30,ed],six:[ed-182,ed],year:[y0,ed]}[p]; }

function toast(msg){ let t=document.querySelector(".toast"); if(t) t.remove(); t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3500); }

function head(title,sub){ const u=UI[lang]; return `<div class="deskhead"><div><div class="eyebrow">${esc(u.regions[region])}</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><span class="stamp">${esc(u.updated+" "+fmtEdition(DATA.edition))}</span></div>`; }

function renderBrief(){
  const u=UI[lang]; const [a,b]=windowFor(period);
  const pool=DATA.stories.filter(s=>inRegion(s)&&dayNum(s.d)>=a&&dayNum(s.d)<=b).sort(rank);
  let h=head(u.desks.brief,u.heads.brief);
  h+=`<div class="dial" role="group" aria-label="Period">`+PER.map(p=>`<button id="p-${p}" data-p="${p}" aria-pressed="${p===period}">${p==="live"?'<span class="dot"></span>':""}${u.periods[p]}</button>`).join("")+`</div>`;
  const tk=(DATA.markets||{})[region]||[];
  if(tk.length) h+=`<div class="ticker">`+tk.map(t=>`<div><div class="k">${esc(t[0])}</div><div class="v">${esc(t[1])}</div><div class="d ${t[3]||""}">${esc(t[2])}</div></div>`).join("")+`</div>`;
  const lead=pool[0];
  if(lead){ h+=`<section class="lead ${CLS[lead.k]}"><div class="kicker"><span>${u.lead} · ${u.desks[lead.k]}</span><span class="m">${esc(fmtDate(lead.d,lead.t,lead.dl))}</span></div><h2>${hl(lead)}</h2><p>${esc(T(lead)[1])}</p>${srcLine(lead)}</section>`; }
  h+=`<div class="board">`+["war","money","power"].map(k=>{
    const items=pool.filter(s=>s.k===k&&s!==lead).slice(0,3);
    return `<div class="col ${CLS[k]}"><h3>${u.desks[k]}</h3>`+(items.length?`<ol>`+items.map(s=>`<li><span class="when"><span>${esc(fmtDate(s.d,s.t,s.dl))} · ${esc(s.s)}</span>${sbtn(s)}</span><b>${hl(s)}</b><span class="sum">${esc(T(s)[1])}</span></li>`).join("")+`</ol>`:`<p class="empty">${u.empty}</p>`)+`</div>`;
  }).join("")+`</div>`;
  return h;
}
function renderDesk(k){
  const u=UI[lang]; const ed=dayNum(DATA.edition);
  const items=DATA.stories.filter(s=>s.k===k&&inRegion(s)).sort((x,y)=>(dayNum(y.d)-dayNum(x.d))||((y.t||"").localeCompare(x.t||""))||(y.i-x.i));
  const groups=[["week",s=>ed-dayNum(s.d)<=6],["month",s=>ed-dayNum(s.d)>6&&ed-dayNum(s.d)<=30],["older",s=>ed-dayNum(s.d)>30]];
  const topId=(items.filter(s=>ed-dayNum(s.d)<=6).sort(rank)[0]||{}).id;
  let h=head(u.desks[k],u.heads[k])+`<div class="${CLS[k]}">`;
  let any=false;
  groups.forEach(([g,f])=>{ const list=items.filter(f); if(!list.length) return; any=true;
    if(g==="week"&&topId){ const i=list.findIndex(s=>s.id===topId); if(i>0) list.unshift(list.splice(i,1)[0]); }
    h+=`<div class="section">${u.sec[g]}</div><div class="feed">`+list.map(s=>`<article class="story ${s.id===topId?"top":""}"><div class="kicker">${s.id===topId?`<span>${u.top}</span>`:""}<span class="m">${esc(fmtDate(s.d,s.t,s.dl))}</span></div><h2>${hl(s)}</h2><p>${esc(T(s)[1])}</p>${srcLine(s)}</article>`).join("")+`</div>`;
  });
  if(!any) h+=`<p class="empty">${u.empty}</p>`;
  return h+`</div>`;
}

  const days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10); return [d,CR.visits.reduce((a,v)=>a+((v.days||{})[d]||0),0)]});

  h+=`<div class="panel"><h3>${c.daily}</h3><div class="bars">`+days.map(d=>`<div style="height:${Math.round(d[1]/max*100)}%"><span>${d[1]||""}</span></div>`).join("")+`</div><div class="barlbl">`+days.map(d=>`<span>${+d[0].slice(8)}</span>`).join("")+`</div></div>`;
  const rows=[...CR.visits].sort((a,b)=>String(b.last).localeCompare(String(a.last))).slice(0,50);
  h+=`<div class="panel"><h3>${c.recent}</h3>`+(rows.length?`<div class="tbl"><table><thead><tr><th>${c.who}</th><th>${c.n}</th><th>${c.first}</th><th>${c.last}</th></tr></thead><tbody>`+rows.map(v=>`<tr><td>${esc(v.self?c.you:(CR.names[v.id]||"—"))} <span class="chip">${v.self?c.you:(v.guest?c.guest:c.member)}</span></td><td class="n">${v.count||0}</td><td class="n">${esc(fmtTime(v.first))}</td><td class="n">${esc(fmtTime(v.last))}</td></tr>`).join("")+`</tbody></table></div>`:`<p class="note">${c.none}</p>`)+`</div>`;
  h+=`<div class="panel"><h3>${c.schedule}</h3><p class="note">${c.schedTxt}</p><p class="note">${c.note}</p></div>`;
  return h;
}

  const m=document.getElementById("main");
  if(!DATA){ m.innerHTML=`<div class="loading">…</div>`; return; }
  if(view==="control"&&isOwner) m.innerHTML=renderControl();
  else { if(view==="control") view="news"; m.innerHTML=desk==="brief"?renderBrief():desk==="mkt"?renderMarkets():renderDesk(desk); if(desk==="mkt") mountTV(); }
  m.querySelectorAll(".dial button").forEach(b=>b.onclick=()=>{period=b.dataset.p;try{localStorage.setItem("wr-period",period)}catch(e){};render()});
}

async function loadNews(manual){
  const btn=document.getElementById("refresh");
  if(manual){ btn.classList.add("spin"); document.getElementById("refreshLbl").textContent=UI[lang].refreshing; }
  try{
    const r=await fetch("news.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error(r.status);
    const j=await r.json(); const newer=!DATA||j.edition!==DATA.edition; DATA=j; render(); if(!deepDone) checkDeep();
    if(manual) toast(newer?UI[lang].newer:UI[lang].latest);
  }catch(e){ if(manual||!DATA) toast(UI[lang].fail); if(!DATA) document.getElementById("main").innerHTML=`<div class="loading">${esc(UI[lang].fail)}</div>`; }
  finally{ btn.classList.remove("spin"); document.getElementById("refreshLbl").textContent=UI[lang].refresh; }
}

/* ---------- capabilities: visit log, presence, owner tools ---------- */
async function boot(){
  if(!window.claude||!window.claude.use) { CR.err=true; return; }
  const [user,db,room]=await Promise.all([claude.use("user"),claude.use("db"),claude.use("room")]);
  if(user){ try{ isOwner=await user.isOwner() }catch(e){} renderChrome(); if(view==="control") render(); }
  let myId=null; if(user){ try{ myId=await user.id() }catch(e){} }
  if(room){
    try{ room.presence({where:region+"/"+desk}).catch(()=>{}); }catch(e){}
    room.onPeers(ch=>{ CR.peers=ch.peers; if(isOwner){ resolveNames(user,ch.peers.map(p=>p.by)); if(view==="control") render(); } });
  }
  if(db&&myId){
    let fresh=true; try{ if(sessionStorage.getItem("wr-v")) fresh=false; else sessionStorage.setItem("wr-v","1") }catch(e){}
    if(fresh){ try{
      const ref=db.doc("visits/"+myId); const snap=await ref.get(); const prev=snap.exists?snap.data():{};
      const now=new Date().toISOString(), key=now.slice(0,10); const days={};
      Object.entries(prev.days||{}).forEach(([k,v])=>{ if(Date.parse(k)>Date.now()-60*864e5) days[k]=v });
      days[key]=(days[key]||0)+1;
      await ref.set({first:prev.first||now,last:now,count:(prev.count||0)+1,days,owner:!!isOwner});
    }catch(e){} }
  }
  if(isOwner&&db){
    db.collection("visits").onSnapshot(s=>{ CR.visits=s.docs.map(d=>({id:d.id,self:d.id===myId,...d.data()})); resolveNames(user,CR.visits.map(v=>v.id)); CR.ready=true; if(view==="control") render(); },()=>{ CR.err=true; if(view==="control") render(); });
  } else if(isOwner){ CR.err=true; }
}
async function resolveNames(user,ids){
  if(!user) return; ids=[...new Set(ids.filter(Boolean))].filter(i=>!(i in CR.names)); if(!ids.length) return;
  try{ const ps=await user.profiles(ids); ids.forEach(i=>{ CR.names[i]=(ps[i]&&ps[i].name)||(lang==="ru"?"Кто-то":"Someone"); }); if(view==="control") render(); }catch(e){}
}

const WEL={
 en:{t:"Welcome to Forseti",p:["In Norse myth, Forseti was the god who heard every side of a dispute before a word of judgement was spoken. We built this site in his name.","Our one job is to keep you independently informed about what matters most in the world: conflicts, money and politics, across every region.","Forseti is made for busy people who don't have time to read dozens of outlets and sort the signal from the noise. We do that work for you and keep only what matters most, so you can catch up in a few minutes."],lead:"We have no opinion of our own.",rest:"We don't take sides, endorse anyone or tell you what to think. To stay as neutral as we can, every story is built from a diverse range of trusted sources, and every claim is attributed to whoever made it. Each story links to its original source, so you can always check for yourself.",ai:"Forseti is compiled with the help of AI and updated several times a day, in seven languages.",motto:"Every side. One record.",btn:"Start reading",link:"About Forseti"},
 ru:{t:"Добро пожаловать в Forseti",p:["В скандинавских мифах Форсети — бог, который выслушивал все стороны спора, прежде чем произнести хоть слово. Мы назвали сайт в его честь.","Наша единственная задача — независимо информировать вас о самом важном, что происходит в мире: конфликтах, финансах и политике во всех регионах.","Forseti создан для занятых людей, у которых нет времени читать десятки изданий и отделять главное от шума. Мы делаем эту работу за вас и оставляем только самое важное, чтобы за несколько минут вы были в курсе событий."],lead:"У нас нет собственного мнения.",rest:"Мы не занимаем ничью сторону, никого не поддерживаем и не говорим вам, что думать. Чтобы оставаться максимально нейтральными, каждую новость мы собираем из множества разнообразных и проверенных источников и всегда указываем, кто именно что заявил. У каждой новости есть ссылка на оригинал, так что вы всегда можете проверить сами.",ai:"Forseti собирается с помощью искусственного интеллекта и обновляется несколько раз в день на семи языках.",motto:"Все стороны. Одна запись.",btn:"Начать чтение",link:"О Forseti"},

 de:{t:"Willkommen bei Forseti",p:["In der nordischen Mythologie war Forseti der Gott, der jede Seite eines Streits anhörte, bevor er ein Urteil sprach. Diese Seite trägt seinen Namen.","Unsere einzige Aufgabe: Sie unabhängig über das Wichtigste in der Welt zu informieren, über Konflikte, Finanzen und Politik in allen Regionen.","Forseti ist für Menschen gemacht, die keine Zeit haben, Dutzende Medien zu lesen und das Wichtige vom Rauschen zu trennen. Wir übernehmen das für Sie und behalten nur das Wesentliche, damit Sie in wenigen Minuten auf dem Laufenden sind."],lead:"Wir haben keine eigene Meinung.",rest:"Wir ergreifen keine Partei, unterstützen niemanden und sagen Ihnen nicht, was Sie denken sollen. Um so neutral wie möglich zu bleiben, stützt sich jede Meldung auf vielfältige, vertrauenswürdige Quellen, und jede Aussage wird ihrem Urheber zugeordnet. Jede Meldung verlinkt auf die Originalquelle, damit Sie selbst nachprüfen können.",ai:"Forseti wird mit Hilfe künstlicher Intelligenz erstellt und mehrmals täglich in sieben Sprachen aktualisiert.",motto:"Jede Seite. Ein Protokoll.",btn:"Jetzt lesen",link:"Über Forseti"},
 es:{t:"Bienvenido a Forseti",p:["En la mitología nórdica, Forseti era el dios que escuchaba a todas las partes de una disputa antes de pronunciar su juicio. Este sitio lleva su nombre.","Nuestra única tarea es mantenerte informado de forma independiente sobre lo más importante que ocurre en el mundo: conflictos, finanzas y política, en todas las regiones.","Forseti está pensado para personas ocupadas que no tienen tiempo de leer decenas de medios y separar lo importante del ruido. Hacemos ese trabajo por ti y nos quedamos solo con lo esencial, para que te pongas al día en pocos minutos."],lead:"No tenemos opinión propia.",rest:"No tomamos partido, no respaldamos a nadie ni te decimos qué pensar. Para ser lo más neutrales posible, cada noticia se basa en fuentes diversas y fiables, y cada afirmación se atribuye a quien la hizo. Cada noticia enlaza a su fuente original, para que siempre puedas comprobarlo tú mismo.",ai:"Forseti se elabora con ayuda de inteligencia artificial y se actualiza varias veces al día, en siete idiomas.",motto:"Todas las partes. Un solo registro.",btn:"Empezar a leer",link:"Sobre Forseti"},

 ar:{t:"مرحباً بكم في Forseti",p:["في الأساطير الإسكندنافية، كان فورسيتي الإله الذي يستمع إلى جميع أطراف النزاع قبل أن ينطق بأي حكم. وقد سمّينا هذا الموقع باسمه.","مهمتنا الوحيدة أن نُبقيكم على اطلاع مستقل بأهم ما يجري في العالم: النزاعات والشؤون المالية والسياسة في كل المناطق.","صُمّم Forseti للأشخاص المشغولين الذين لا يملكون وقتاً لقراءة عشرات المصادر وفرز المهم من الضجيج. نقوم بهذا العمل نيابةً عنكم ونُبقي فقط على الأهم، لتكونوا على اطلاع في دقائق."],lead:"ليس لدينا رأي خاص بنا.",rest:"لا ننحاز إلى أي طرف ولا ندعم أحداً ولا نملي عليكم ما تفكرون فيه. وللبقاء محايدين قدر الإمكان، يُبنى كل خبر على مصادر متنوعة وموثوقة، ويُنسب كل تصريح إلى صاحبه. ويرتبط كل خبر بمصدره الأصلي، لتتمكنوا دائماً من التحقق بأنفسكم.",ai:"يُعدّ Forseti بمساعدة الذكاء الاصطناعي ويُحدَّث عدة مرات يومياً بسبع لغات.",motto:"كل الأطراف. سجل واحد.",btn:"ابدأ القراءة",link:"عن Forseti"}
